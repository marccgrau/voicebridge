repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: orchestrator-ruff-format
        name: orchestrator ruff format
        entry: bash -c 'cd services/orchestrator && uv run ruff format src tests'
        language: system
        pass_filenames: false
        files: ^services/orchestrator/.*\.py$

      - id: orchestrator-ruff
        name: orchestrator ruff check
        entry: bash -c 'cd services/orchestrator && uv run ruff check src tests'
        language: system
        pass_filenames: false
        files: ^services/orchestrator/.*\.py$

      - id: frontend-vitest
        name: pnpm frontend vitest
        entry: bash -c 'pnpm --filter @voicebridge/contracts test && pnpm --filter @voicebridge/db test'
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$

      - id: pnpm-lint
        name: pnpm lint
        entry: pnpm -r lint
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$

      - id: pnpm-typecheck
        name: pnpm typecheck
        entry: pnpm -r typecheck
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$
