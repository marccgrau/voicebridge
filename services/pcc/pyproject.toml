[project]
name = "voicebridge-pcc"
version = "0.1.0"
description = "VoiceBridge unified Pipecat service"
requires-python = ">=3.13"
dependencies = [
    "pipecat-ai[daily,deepgram,local-smart-turn-v3,openai,silero]>=0.0.50",
    "pipecatcloud>=0.2.20",
    "python-dotenv>=1.0.0",
    "python-frontmatter>=1.0.0",
    "torch>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
