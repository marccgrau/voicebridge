name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-pcc:
    name: Python PCC Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: services/pcc
        run: uv sync --dev

      - name: Run tests with coverage
        working-directory: services/pcc
        run: |
          uv run pytest --cov=src --cov-report=term-missing --cov-report=xml | tee pytest-output.txt
          echo "## Python Test Coverage" >> $GITHUB_STEP_SUMMARY
          tail -20 pytest-output.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: github.event_name == 'pull_request'
        with:
          file: services/pcc/coverage.xml
          flags: pcc
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-typescript:
    name: TypeScript Package Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test contracts package
        run: pnpm --filter @voicebridge/contracts test

      - name: Test database package with coverage
        run: |
          pnpm --filter @voicebridge/db test --coverage
          echo "## TypeScript Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "Database package: 55 tests" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: github.event_name == 'pull_request'
        with:
          directory: packages/db/coverage
          flags: typescript
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint TypeScript
        run: pnpm lint

      - name: Type check TypeScript
        run: pnpm typecheck

      - name: Lint Python
        working-directory: services/pcc
        run: |
          uv sync --dev
          uv run ruff check .

      - name: Format check Python
        working-directory: services/pcc
        run: uv run ruff format --check .
